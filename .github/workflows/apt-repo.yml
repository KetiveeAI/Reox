# GitHub Actions workflow to publish APT repository to GitHub Pages
# Triggered after releases are created

name: Publish APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Prepare APT Repository
        run: |
          # Fetch and checkout gh-pages branch
          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

          mkdir -p apt-repo
          # Move existing content to apt-repo if we are on gh-pages root
          # Note: If gh-pages has other content, we should target a specific dir. 
          # Assuming repo root is the apt repo.

          # We need to preserve 'pool' and 'dists'.
          # If we are in root of gh-pages, they are already here.

      - name: Download release .deb
        run: |
          VERSION="${{ github.event.release.tag_name || 'v0.5.0-beta' }}"
          VERSION="${VERSION#v}"

          mkdir -p pool/main

          # Download from release
          # Note: We use the NEW name format from release.yml
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/reoxc_${VERSION}_amd64.deb" \
            -o "pool/main/reoxc_${VERSION}_amd64.deb" || echo "Deb not found in release"

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Generate repository metadata
        run: |
          # Generate Packages
          mkdir -p dists/stable/main/binary-amd64
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages

          # Generate Release
          cat > dists/stable/Release << EOF
          Origin: Reox
          Label: Reox
          Suite: stable
          Codename: stable
          Version: 1.0
          Architectures: amd64
          Components: main
          Description: Reox Language APT Repository
          Date: $(date -Ru)
          EOF

          # Add checksums
          echo "MD5Sum:" >> dists/stable/Release
          for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
            if [ -f "dists/stable/$f" ]; then
              HASH=$(md5sum "dists/stable/$f" | cut -d' ' -f1)
              SIZE=$(wc -c < "dists/stable/$f")
              echo " $HASH $SIZE $f" >> dists/stable/Release
            fi
          done

          echo "SHA256:" >> dists/stable/Release
          for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
            if [ -f "dists/stable/$f" ]; then
              HASH=$(sha256sum "dists/stable/$f" | cut -d' ' -f1)
              SIZE=$(wc -c < "dists/stable/$f")
              echo " $HASH $SIZE $f" >> dists/stable/Release
            fi
          done

      - name: Import GPG key and sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --import
            gpg -abs -o dists/stable/Release.gpg dists/stable/Release
            gpg --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --export --armor > reox.gpg
          else
            echo "No GPG key configured, skipping signing"
          fi

      - name: Deploy to GitHub Pages
        run: |
          git add pool dists reox.gpg
          git commit -m "Update APT repository for version ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          git push origin gh-pages
