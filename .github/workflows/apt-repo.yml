# GitHub Actions workflow to publish APT repository to GitHub Pages
# Triggered after releases are created

name: Publish APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build APT Repository
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi

          # Work in a temp directory
          mkdir -p /tmp/apt-work/pool/main
          mkdir -p /tmp/apt-work/dists/stable/main/binary-amd64

          # Try to download .deb from release (skip gracefully if missing)
          DEB_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/reoxc_${VERSION}_amd64.deb"
          curl -fsSL "$DEB_URL" -o "/tmp/apt-work/pool/main/reoxc_${VERSION}_amd64.deb" \
            && echo "Downloaded .deb for ${VERSION}" \
            || echo "No .deb found for ${VERSION}, building metadata only"

          cd /tmp/apt-work

          # Generate Packages index
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages 2>/dev/null || touch dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages

          # Generate Release file
          cat > dists/stable/Release << EOF
          Origin: Reox
          Label: Reox
          Suite: stable
          Codename: stable
          Version: ${VERSION}
          Architectures: amd64
          Components: main
          Description: Reox Language APT Repository
          Date: $(date -Ru)
          EOF

          # Add checksums
          echo "MD5Sum:" >> dists/stable/Release
          for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
            if [ -f "dists/stable/$f" ]; then
              HASH=$(md5sum "dists/stable/$f" | cut -d' ' -f1)
              SIZE=$(wc -c < "dists/stable/$f")
              echo " $HASH $SIZE $f" >> dists/stable/Release
            fi
          done

          echo "SHA256:" >> dists/stable/Release
          for f in main/binary-amd64/Packages main/binary-amd64/Packages.gz; do
            if [ -f "dists/stable/$f" ]; then
              HASH=$(sha256sum "dists/stable/$f" | cut -d' ' -f1)
              SIZE=$(wc -c < "dists/stable/$f")
              echo " $HASH $SIZE $f" >> dists/stable/Release
            fi
          done

      - name: Import GPG key and sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --import
            gpg -abs -o /tmp/apt-work/dists/stable/Release.gpg /tmp/apt-work/dists/stable/Release
            gpg --clearsign -o /tmp/apt-work/dists/stable/InRelease /tmp/apt-work/dists/stable/Release
            gpg --export --armor > /tmp/apt-work/reox.gpg
          else
            echo "No GPG key configured, skipping signing"
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        run: |
          # Switch to gh-pages branch (create if missing)
          git fetch origin gh-pages || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clean tracked files, keep .git
          git rm -rf . --quiet 2>/dev/null || true

          # Copy in the built repo
          cp -r /tmp/apt-work/pool . 2>/dev/null || true
          cp -r /tmp/apt-work/dists . 2>/dev/null || true
          cp /tmp/apt-work/reox.gpg . 2>/dev/null || true

          # Add README for the gh-pages branch
          cat > README.md << 'EOF'
          # Reox APT Repository

          Add this repository to your sources:

          ```bash
          curl -fsSL https://ketiveeai.github.io/Reox/reox.gpg | sudo gpg --dearmor -o /usr/share/keyrings/reox.gpg
          echo "deb [signed-by=/usr/share/keyrings/reox.gpg] https://ketiveeai.github.io/Reox stable main" | sudo tee /etc/apt/sources.list.d/reox.list
          sudo apt update
          sudo apt install reoxc
          ```
          EOF

          git add -A
          git commit -m "APT repo: v${{ github.event.release.tag_name || '1.0.0' }}" || echo "Nothing to commit"
          git push origin gh-pages --force
